<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hooked — Legal &amp; Policies</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --surface: #13161f;
      --border: #2e3448;
      --text: #f3f5fa;
      --muted: #a0a8be;
      --accent: #ff4d4d;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    main {
      max-width: 760px;
      margin: 48px auto;
      padding: 0 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
    }
    h1 { margin-top: 0; font-size: 2rem; }
    p { color: var(--muted); }
    .links { display: grid; gap: 12px; margin-top: 24px; }
    a.btn {
      display: block;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #1b1f2c;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
    }
    a.btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Hooked Legal Center</h1>
      <p>Official policy documents for the Hooked Android application, provided for Google Play Console compliance and user transparency.</p>
      <div class="links">
        <a class="btn" href="./privacy-policy.html">Privacy Policy</a>
        <a class="btn" href="./terms-and-conditions.html">Terms and Conditions</a>
      </div>
    </div>
  </main>
</body>
</html>
